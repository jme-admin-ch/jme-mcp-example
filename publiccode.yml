description:
  en:
    localisedName: jme-mcp-example
    shortDescription: jEAP example for the MCP starter, with one authenticated and one anonymous-access service.
    longDescription: >
      jme-mcp-example shows jeap-spring-boot-mcp-starter in two runnable Spring Boot services: one exposing
      authenticated MCP tools, backed by a local jeap-oauth-mock-server instance that issues bearer tokens, and
      one with jeap.mcp.security.anonymous-access enabled, mixing a public tool with a protected one to show that
      each tool still enforces its own rule.
    features:
      - MCP server exposing tools via jeap-spring-boot-mcp-starter
      - Default-deny authenticated tool access with a local OAuth mock server
      - Opt-in anonymous access with public and protected tools side by side
